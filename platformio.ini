; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = test_native

[test_base]
test_framework = unity
lib_ldf_mode = deep+
test_build_src = yes
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DUNITY_INCLUDE_CONFIG_H
	-DSTANDALONE_TESTS
extra_scripts =
	scripts/inject_version_define.py
	scripts/generate_web_assets.py
lib_deps = 
	https://github.com/andrewmherren/web_platform_interface.git#v0.3.0
	bblanchon/ArduinoJson@^7.0.0

[env:test_native]
extends = test_base
platform = native
test_filter = *
build_src_filter = 
	+<../test/native/src/**>
	+<../src/core/**>
	+<../src/types/**>
	-<../src/platform_provider.cpp>
	-<../src/platform/**>
	+<../src/platform/openapi_spec_helpers.cpp>
	+<../src/platform/certificate_loader.cpp>
	+<../src/platform/wifi_credentials_store.cpp>
	-<../src/handlers/**>
	+<../src/handlers/system_status_helpers.cpp>
	-<../src/auth/**>
	+<../src/auth/auth_utils.cpp>
	+<../src/auth/auth_decision.cpp>
	-<../src/interface/**>
	+<../src/interface/auth_types.cpp>
	-<../src/models/**>
	+<../src/models/auth_user.cpp>
	+<../src/models/auth_session.cpp>
	+<../src/models/auth_api_token.cpp>
	+<../src/models/auth_page_token.cpp>
	-<../src/storage/**>
	+<../src/storage/query_builder.cpp>
	+<../src/storage/json_database_driver.cpp>
	+<../src/storage/littlefs_database_driver.cpp>
	+<../src/storage/storage_manager.cpp>
	+<../src/storage/auth_storage.cpp>
	-<../src/utilities/**>
	-<../src/assets/**>
build_flags =
	${test_base.build_flags}
	-DNATIVE_PLATFORM
	-g
	-O0
	--coverage
	-fno-inline
	-DARDUINOFAKE_ENABLE_WIFI
	-DARDUINOFAKE_ENABLE_SERIAL
	-DARDUINOFAKE_ENABLE_STRING
	-I test/native/include
extra_scripts = 
	${test_base.extra_scripts}
	scripts/coverage_flags.py
lib_deps = 
	${test_base.lib_deps}
	https://github.com/FabioBatSilva/ArduinoFake.git
	Unity
	bblanchon/ArduinoJson@^7.0.0
check_tool = cppcheck
check_flags = cppcheck: --enable=all --std=c++17

[env:test_esp32]
extends = test_base
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
test_filter = *
; arduino-esp32 3.x's WiFi library needs Networking's Network.h, but PlatformIO's
; deep+/chain+ LDF modes (preprocessor-aware scanning, inherited from test_base)
; fail to resolve it - see https://github.com/espressif/arduino-esp32/issues/9782.
; Plain deep works around it; test_native is unaffected (different platform).
lib_ldf_mode = deep
build_flags =
	${test_base.build_flags}
	-DESP_PLATFORM
	-DARDUINO_USB_MODE=1
build_src_filter =
	+<*>
	+<../test/esp32/**/*.cpp>
lib_ignore = Unity
monitor_speed = 115200
upload_speed = 460800
