; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = test_native

[test_base]
test_framework = unity
lib_ldf_mode = deep+
test_build_src = yes
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DUNITY_INCLUDE_CONFIG_H
	-DSTANDALONE_TESTS
extra_scripts = scripts/inject_version_define.py
lib_deps = 
	https://github.com/andrewmherren/web_platform_interface.git#c81f94625bd560506951778d7b770a7c158b33e8
	bblanchon/ArduinoJson@^7.0.0

[env:test_native]
extends = test_base
platform = native
test_filter = *
build_src_filter = 
	+<../test/native/src/**>
	+<../src/core/**>
	+<../src/types/**>
	-<../src/platform_provider.cpp>
	-<../src/platform/**>
	-<../src/handlers/**>
	-<../src/auth/**>
	+<../src/auth/auth_utils.cpp>
	-<../src/interface/**>
	-<../src/models/**>
	-<../src/storage/**>
	-<../src/utilities/**>
	-<../src/assets/**>
build_flags = 
	${test_base.build_flags}
	-DNATIVE_PLATFORM
	-g
	-O0
	--coverage
	-fno-inline
	-DARDUINOFAKE_ENABLE_WIFI
	-DARDUINOFAKE_ENABLE_SERIAL
	-DARDUINOFAKE_ENABLE_STRING
extra_scripts = 
	${test_base.extra_scripts}
	scripts/coverage_flags.py
lib_deps = 
	${test_base.lib_deps}
	https://github.com/FabioBatSilva/ArduinoFake.git
	Unity
	bblanchon/ArduinoJson@^7.0.0
check_tool = cppcheck
check_flags = cppcheck: --enable=all --std=c++17

[env:test_esp32]
extends = test_base
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
test_filter = *
build_flags = 
	${test_base.build_flags}
	-DESP_PLATFORM
	-DARDUINO_USB_MODE=1
build_src_filter = 
	+<*>
	+<../test/esp32/**/*.cpp>
lib_ignore = Unity
monitor_speed = 115200
upload_speed = 460800
